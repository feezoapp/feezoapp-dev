<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FeeZoapp</title>
<meta name="theme-color" content="#0a1428">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FeeZo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
@media(max-width:600px){
.feezo-home{padding:0 0 10px!important}
/* Clean modern dashboard heading: only Dashboard is shown. */
.feezo-home .dash-header{gap:10px!important;margin-bottom:14px!important}
.feezo-home .dash-eyebrow,.feezo-home .dash-subtitle{display:none!important}
.feezo-home .dash-title{font-size:24px!important;line-height:1.15!important;margin:0 0 12px!important;letter-spacing:-.035em!important}
/* Modern month/filter controls */
.feezo-home .dash-actions{display:grid!important;grid-template-columns:minmax(0,1.35fr) minmax(0,.8fr) minmax(0,.8fr)!important;width:100%!important;gap:7px!important;align-items:center!important}
.feezo-home .month-control{min-width:0!important;width:100%!important;height:42px!important;border-radius:14px!important;padding:3px!important;background:var(--card)!important;border:1px solid rgba(100,116,139,.18)!important;box-shadow:0 4px 14px rgba(15,23,42,.06)!important;position:relative!important}
.feezo-home .month-control button{width:31px!important;height:34px!important;border-radius:10px!important;font-size:17px!important}
.feezo-home .month-control button:first-child,.feezo-home .month-control button:last-child{display:none!important}
.feezo-home .month-control:before{content:'▣';display:grid;place-items:center;width:28px;height:30px;margin-left:2px;color:#4f73d9;font-size:14px;font-weight:800;flex:0 0 auto}
.feezo-home .month-name{min-width:0!important;flex:1!important;font-size:11.5px!important;font-weight:800!important;white-space:nowrap!important;text-align:center!important;color:inherit!important}
.feezo-home .month-control button:nth-child(2),.feezo-home .month-control button:nth-child(4){font-size:20px!important;color:#334155!important}
.feezo-home .modern-control{min-width:0!important;width:100%!important;height:42px!important;min-height:42px!important;padding:0 9px!important;border-radius:14px!important;white-space:nowrap!important;font-size:10.5px!important;font-weight:750!important;box-shadow:0 4px 14px rgba(15,23,42,.05)!important}
.feezo-home .kpi-grid{gap:8px!important}
.feezo-home .kpi{min-height:100px!important;padding:12px!important;border-radius:16px!important;box-shadow:0 4px 14px rgba(15,23,42,.045)!important}
.feezo-home .kpi-icon{width:28px!important;height:28px!important;border-radius:9px!important;font-size:12px!important}
.feezo-home .kpi-label{font-size:10px!important}
.feezo-home .kpi-value{margin-top:9px!important;font-size:21px!important}
.feezo-home .kpi-helper{margin-top:5px!important;font-size:9px!important}
.feezo-home .analytics{margin-top:11px!important;gap:9px!important}
.feezo-home .chart-panel{padding:12px 10px 8px!important;border-radius:16px!important}
.feezo-home .panel-head{margin-bottom:5px!important;gap:7px!important}
.feezo-home .panel-title{font-size:13px!important;line-height:1.25!important}
.feezo-home .panel-meta{font-size:9px!important}
.feezo-home .segmented{padding:2px!important;border-radius:9px!important;flex-shrink:0!important}
.feezo-home .segmented button{padding:5px 8px!important;font-size:9px!important;border-radius:7px!important}
.feezo-home .chart-panel .recharts-responsive-container{height:190px!important}
.feezo-home .chart-panel .recharts-wrapper{max-height:190px!important}
.feezo-home .insight-panel{padding:12px!important;border-radius:16px!important}
.feezo-home .insight-title{font-size:13px!important;margin-bottom:5px!important}
.feezo-home .insight-row{padding:8px 0!important}
.feezo-home .insight-label{font-size:9.5px!important}
.feezo-home .insight-value{font-size:15px!important}
.page{padding-left:10px!important;padding-right:10px!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
