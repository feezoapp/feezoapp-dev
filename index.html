<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FeeZoapp</title>
<meta name="theme-color" content="#0a1428">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FeeZo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
.feezo-home .dash-title{letter-spacing:-.035em;font-weight:850}
.feezo-home .kpi{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.feezo-home .kpi:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(15,23,42,.09)}
.feezo-home .panel{box-shadow:0 7px 24px rgba(15,23,42,.045)}
.feezo-home .insight-panel{display:none!important}
.feezo-home .kpi-percent{display:block;margin-top:5px;font-size:9px;font-weight:750;letter-spacing:.01em;color:var(--gray)}
.feezo-home .kpi-percent strong{font-weight:900}
@media(max-width:600px){
.feezo-home{padding:0 0 8px!important}
.feezo-home .dash-header{display:block!important;margin-bottom:15px!important;padding-top:3px!important}
.feezo-home .dash-eyebrow,.feezo-home .dash-subtitle{display:none!important}
.feezo-home .dash-title{font-size:25px!important;line-height:1.12!important;margin:0 0 14px!important;font-weight:850!important;letter-spacing:-.04em!important}
.feezo-home .dash-actions{display:grid!important;grid-template-columns:minmax(0,1.45fr) minmax(0,.78fr) minmax(0,.78fr)!important;gap:7px!important;width:100%!important;align-items:center!important}
.feezo-home .month-control{display:flex!important;align-items:center!important;justify-content:space-between!important;min-width:0!important;width:100%!important;height:44px!important;padding:4px!important;border-radius:15px!important;background:var(--card)!important;border:1px solid rgba(100,116,139,.17)!important;box-shadow:0 5px 16px rgba(15,23,42,.065)!important;position:relative!important}
.feezo-home .month-control:before{content:'📅';display:grid!important;place-items:center!important;flex:0 0 30px!important;width:30px!important;height:30px!important;margin-left:1px!important;border-radius:9px!important;background:rgba(79,115,217,.11)!important;color:#4f73d9!important;font-size:14px!important;line-height:1!important}
.feezo-home .month-control button{width:31px!important;height:34px!important;border:0!important;border-radius:10px!important;background:transparent!important;color:#334155!important;font-size:19px!important;font-weight:850!important;flex:0 0 31px!important}
.feezo-home .month-control button:first-child,.feezo-home .month-control button:last-child{display:none!important}
.feezo-home .month-control button:nth-child(2),.feezo-home .month-control button:nth-child(4){display:grid!important;place-items:center!important}
.feezo-home .month-name{min-width:0!important;flex:1!important;text-align:center!important;font-size:11.5px!important;font-weight:850!important;white-space:nowrap!important;letter-spacing:-.01em!important}
.feezo-home .modern-control{display:flex!important;align-items:center!important;justify-content:center!important;min-width:0!important;width:100%!important;height:44px!important;min-height:44px!important;padding:0 8px!important;border-radius:15px!important;background:var(--card)!important;border:1px solid rgba(100,116,139,.17)!important;box-shadow:0 5px 16px rgba(15,23,42,.055)!important;white-space:nowrap!important;font-size:10.5px!important;font-weight:800!important}
.feezo-home .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
.feezo-home .kpi{min-height:101px!important;padding:12px!important;border-radius:17px!important;border:1px solid rgba(100,116,139,.15)!important;box-shadow:0 5px 16px rgba(15,23,42,.055)!important}
.feezo-home .kpi:before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 4px 4px 0;background:currentColor;opacity:.82}
.feezo-home .kpi-top{align-items:center!important}
.feezo-home .kpi-label{font-size:10px!important;font-weight:800!important}
.feezo-home .kpi-icon{width:29px!important;height:29px!important;border-radius:9px!important;font-size:12px!important;box-shadow:0 3px 8px rgba(15,23,42,.07)!important}
.feezo-home .kpi-value{margin-top:8px!important;font-size:22px!important;line-height:1!important;font-weight:900!important;letter-spacing:-.04em!important}
.feezo-home .kpi-helper{margin-top:4px!important;font-size:9px!important;font-weight:550!important}
.feezo-home .kpi-percent{margin-top:4px!important;font-size:8.5px!important}
.feezo-home .kpi:after{width:86px!important;height:86px!important;right:-35px!important;bottom:-40px!important}
.feezo-home .blue .kpi-icon{background:rgba(79,115,217,.12)!important;color:#4f73d9!important}
.feezo-home .orange .kpi-icon{background:rgba(217,147,63,.13)!important;color:#d9933f!important}
.feezo-home .green .kpi-icon{background:rgba(62,170,130,.13)!important;color:#3eaa82!important}
.feezo-home .red .kpi-icon{background:rgba(214,95,107,.13)!important;color:#d65f6b!important}
.feezo-home .analytics{display:block!important;margin-top:11px!important}
.feezo-home .chart-panel{padding:13px 10px 8px!important;border-radius:17px!important;border:1px solid rgba(100,116,139,.15)!important;box-shadow:0 6px 20px rgba(15,23,42,.05)!important}
.feezo-home .panel-head{display:flex!important;align-items:center!important;margin-bottom:6px!important;gap:6px!important}
.feezo-home .panel-title{font-size:13px!important;line-height:1.25!important;font-weight:850!important;min-width:0!important}
.feezo-home .panel-meta{font-size:9px!important;font-weight:650!important}
.feezo-home .segmented{padding:2px!important;border-radius:10px!important;flex-shrink:0!important;background:var(--bg)!important}
.feezo-home .segmented button{padding:6px 9px!important;font-size:9px!important;font-weight:850!important;border-radius:7px!important}
.feezo-home .chart-panel .recharts-responsive-container{height:190px!important}
.feezo-home .chart-panel .recharts-wrapper{max-height:190px!important}
.page{padding-left:10px!important;padding-right:10px!important}
}
@media(min-width:601px){.feezo-home .dash-title{font-size:28px!important}.feezo-home .kpi{min-height:118px!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
<script>
(function(){
  function updateKpiPercentages(){
    const root=document.querySelector('.feezo-home');
    if(!root) return;
    const cards=[...root.querySelectorAll('.kpi-grid .kpi')];
    if(!cards.length) return;
    const totalCard=cards.find(c=>(c.querySelector('.kpi-label')?.textContent||'').trim()==='Total Students');
    const total=parseFloat((totalCard?.querySelector('.kpi-value')?.textContent||'').replace(/[^0-9.]/g,''))||0;
    cards.forEach(card=>{
      const label=(card.querySelector('.kpi-label')?.textContent||'').trim();
      let pct=null, text='';
      const value=parseFloat((card.querySelector('.kpi-value')?.textContent||'').replace(/[^0-9.]/g,''));
      if(label==='Total Students'){ pct=100; text='100% of total students'; }
      else if(label==='Joined' || label==='Fee Pending'){ pct=total>0 ? Math.round((value/total)*100) : 0; text=pct+'% of total students'; }
      else if(label==='Fees Collected'){
        // A fee percentage requires total billed amount, which this card does not expose.
        // Show a neutral overall marker instead of presenting a misleading calculation.
        text='Overall fee collection';
      }
      let badge=card.querySelector('.kpi-percent');
      if(!badge){ badge=document.createElement('div'); badge.className='kpi-percent'; const helper=card.querySelector('.kpi-helper'); helper?.after(badge); }
      badge.innerHTML=pct===null ? text : '<strong>'+pct+'%</strong> '+text.replace(/^\d+%\s*/,'');
    });
  }
  const observer=new MutationObserver(updateKpiPercentages);
  observer.observe(document.documentElement,{childList:true,subtree:true,characterData:true});
  setTimeout(updateKpiPercentages,300);
  setTimeout(updateKpiPercentages,1000);
})();
</script>
</body>
</html>
